name: CI

on:
  push:
    branches: [main, jules-*]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smart-queue-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: smart-queue-bot/package-lock.json
      - run: npm ci
      - run: npm test
